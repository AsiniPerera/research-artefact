# Render blueprint for the Amore Beauty project.
#
# Two web services off one repo:
#   salon-api       FastAPI (backend/api), Python 3.12, reads Supabase
#   salon-frontend  Vite static build, proxies /api/* to the API
#
# The static-site rewrite STRIPS /api from the path before forwarding, which
# matches the Vite dev proxy in frontend/vite.config.js, so the backend's
# routes stay mounted at root (/rankings, /providers, …) with no change.
#
# Secrets (sync: false) must be filled in from the Render dashboard once:
#   DATABASE_URL     the Supabase session-pooler URL (IPv4-friendly)
#   ALLOWED_ORIGINS  https://salon-frontend.onrender.com   (adjust to the final host)
# JWT_SECRET is generated by Render itself and kept hidden.

services:
  - type: web
    name: salon-api
    runtime: python
    rootDir: ResearchDev/backend/api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        sync: false
      - key: RENDER
        value: "1"
      - key: PYTHON_VERSION
        value: "3.12.5"

  - type: web
    name: salon-frontend
    runtime: static
    rootDir: ResearchDev/frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://salon-api-oxc6.onrender.com/*
