# Render blueprint for the Amore Beauty project.
#
# One Docker web service, built from the repo-root Dockerfile: FastAPI
# (backend/api) serves its own JSON routes and also serves the built React
# frontend (frontend/dist) from the same origin. See backend/api/main.py's
# static mount at the bottom of the file, and the Dockerfile's comments for
# why two build stages (Node, then Python) are needed.
#
# This replaces the earlier two-service split (salon-api + a static
# salon-frontend proxying /api/* to it), which needed a cross-service
# rewrite rule that proved unreliable in practice. One origin means no
# rewrite, no CORS, and nothing to keep in sync when a service's URL changes.
#
# Secrets (sync: false) must be filled in from the Render dashboard once:
#   DATABASE_URL   the Supabase session-pooler URL (IPv4-friendly)
# JWT_SECRET is generated by Render itself and kept hidden. ALLOWED_ORIGINS
# is not needed in production now that the frontend and API share an origin
# (it still defaults to the local Vite dev server for local development).

services:
  - type: web
    name: amore-beauty
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: RENDER
        value: "1"
